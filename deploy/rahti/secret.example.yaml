# TERE4AI v2, Phase 2 SEED (PROPOSAL, UNTESTED). Never applied to any cluster.
# EXAMPLE ONLY: every value below is an obviously fake placeholder.
# Never apply this file (it is excluded from kustomization.yaml). Create the
# real secret out of band, for example:
#   oc create secret generic tere4ai2-secrets \
#     --from-literal=OPENAI_API_KEY=... \
#     --from-literal=ANTHROPIC_API_KEY=... \
#     --from-literal=NEO4J_PASSWORD=...
# Secrets are never committed and never logged (architecture.md Section 13,
# secret redaction; Section 8 / REF-31, MCP security).
apiVersion: v1
kind: Secret
metadata:
  name: tere4ai2-secrets
  labels:
    app.kubernetes.io/part-of: tere4ai2
type: Opaque
stringData:
  # Paid model providers (generator and judge, architecture.md Section 7).
  OPENAI_API_KEY: "sk-FAKE-PLACEHOLDER-do-not-use-0000000000000000"
  ANTHROPIC_API_KEY: "sk-ant-FAKE-PLACEHOLDER-do-not-use-0000000000000000"
  # Neo4j password for the StatefulSet. No dev default in the cluster.
  NEO4J_PASSWORD: "FAKE-PLACEHOLDER-change-me"
  # Phase 2 auth seeds (not read by any Phase 1 code; see
  # docs/PHASE2_DESIGN.md Sections 3 and 6):
  # pepper for hashing tenant API-key secrets in the key store.
  TERE4AI_KEY_PEPPER: "FAKE-PLACEHOLDER-random-32-bytes"
