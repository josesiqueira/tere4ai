[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tere4ai"
version = "2.0.0a0"
description = "TERE4AI v2: evidence-gated compliance support for the EU AI Act (thesis project)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "Jose Siqueira de Cerqueira", email = "jose.siqueiradecerqueira@tuni.fi" }]
keywords = ["EU AI Act", "requirements engineering", "knowledge graph", "trustworthy AI"]

dependencies = [
    "pydantic>=2.7",
    "lxml>=5.0",
    "neo4j>=5.0",
    "fastmcp>=2.0",
    "jsonschema>=4.21",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
