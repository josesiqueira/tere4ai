# TERE4AI v2 CI: the offline quality gates on every push.
# Live model tests are excluded by design (TERE4AI_LIVE_TESTS unset).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src scripts tests
      - name: Build UI data (the web-copy honesty gate reads it)
        run: python scripts/export_ui_data.py
      - name: Tests (offline; live and Neo4j tests skip without their env)
        run: python -m pytest -q
      - name: Traceability gate (includes the dash check)
        run: python scripts/check_traceability.py
      - name: Release hygiene (CHANGELOG discipline, license readiness)
        run: python scripts/check_release_hygiene.py
      - name: Traceability matrix is current
        run: |
          git diff --exit-code docs/traceability.md || {
            echo "docs/traceability.md is stale; regenerate with scripts/check_traceability.py";
            exit 1;
          }
      - name: Server docs are current
        run: python scripts/gen_server_docs.py --check

  docs:
    # The Pages site (DEC-22) is built from docs/server in strict mode on
    # every push and pull request; it is not deployed from here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs (the docs extra's pin in pyproject.toml; not the package)
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['docs']))" > "$RUNNER_TEMP/docs-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/docs-requirements.txt"
      - name: Build the site (strict)
        run: bash scripts/build_site.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install python core and the hleg extra (the parse checks the HLEG text, DEC-25)
        run: python -m pip install -e ".[hleg]"
      - name: Build layer1 dump and UI data
        run: |
          python -m tere4ai.parse_legal_structure
          python scripts/export_ui_data.py
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
