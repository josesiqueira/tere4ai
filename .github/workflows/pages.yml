name: pages
# Publishes the site built from docs/server (DEC-22) to GitHub Pages.
# Enabled by the owner in the repository settings (Pages, source GitHub
# Actions) on 2026-10-03 (B90, D1: before B74, without the sessions page).
on:
  push:
    branches: [main]
    paths:
      - "docs/server/**"
      - "mkdocs.yml"
      - "scripts/build_site.sh"
      - "pyproject.toml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs (the docs extra's pin in pyproject.toml; not the package)
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['docs']))" > "$RUNNER_TEMP/docs-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/docs-requirements.txt"
      - name: Build the site (strict)
        run: bash scripts/build_site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
