<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1660" viewBox="0 0 1680 1660"><defs><marker id="ah" markerWidth="11" markerHeight="11" refX="8.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 z" fill="#8b98a5"/></marker></defs><rect x="0" y="0" width="1680" height="1660" rx="0" fill="#0b0e14" fill-opacity="1.0" stroke="#0b0e14" stroke-width="0"/><text x="840.0" y="52" font-family="DejaVu Sans, sans-serif" font-size="40" fill="#e6edf3" text-anchor="middle" font-weight="bold">TERE4AI v2  Architecture</text><text x="840.0" y="86" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#9aa4ad" text-anchor="middle">Phase 1: self-hosted core with a thin demo Web UI. The multi-tenant hosted SaaS is Phase 2+ over the same code.</text><text x="40" y="136" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#6e7681" text-anchor="start" font-weight="bold" letter-spacing="1.5">CONSUMERS</text><rect x="245" y="156" width="320" height="120" rx="14" fill="#191426" fill-opacity="1.0" stroke="#a371f7" stroke-width="2.5"/><text x="405.0" y="184" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#a371f7" text-anchor="middle" font-weight="bold">Coding Agent</text><text x="405.0" y="206" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#9aa4ad" text-anchor="middle">Claude Code, Cursor, ...</text><text x="405.0" y="224.5" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#9aa4ad" text-anchor="middle">speaks MCP</text><text x="405.0" y="243.0" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#9aa4ad" text-anchor="middle">reads SKILL.md</text><rect x="605" y="156" width="320" height="120" rx="14" fill="#0f1a2b" fill-opacity="1.0" stroke="#4493f8" stroke-width="2.5"/><text x="765.0" y="184" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#4493f8" text-anchor="middle" font-weight="bold">Human (Browser)</text><text x="765.0" y="206" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#9aa4ad" text-anchor="middle">demo, screenshots,</text><text x="765.0" y="224.5" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#9aa4ad" text-anchor="middle">coverage matrix, viva</text><rect x="1075" y="156" width="365" height="120" rx="14" fill="#12151b" fill-opacity="1.0" stroke="#484f58" stroke-width="2.5" stroke-dasharray="7,6"/><text x="1257.5" y="184" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#9aa4ad" text-anchor="middle" font-weight="bold">Phase 2+ consumers</text><text x="1257.5" y="206" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#9aa4ad" text-anchor="middle">remote agents, REST clients</text><text x="1257.5" y="224.5" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#9aa4ad" text-anchor="middle">added with the hosted SaaS</text><text x="40" y="332" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#6e7681" text-anchor="start" font-weight="bold" letter-spacing="1.5">PHASE 1  -  RUNTIME  (docker compose up)</text><rect x="200" y="350" width="1240" height="470" rx="14" fill="#0c1a1c" fill-opacity="0.55" stroke="#39d0d8" stroke-width="2.5"/><rect x="216" y="335" width="108" height="30" rx="15" fill="#0b0e14" fill-opacity="1.0" stroke="#39d0d8" stroke-width="2"/><text x="270" y="355" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#39d0d8" text-anchor="middle" font-weight="bold" letter-spacing="1">PHASE 1</text><text x="345" y="355" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#7fe3e8" text-anchor="start" font-weight="bold">SELF-HOSTED, everything below runs on the user's machine</text><rect x="245" y="410" width="300" height="140" rx="14" fill="#20131b" fill-opacity="1.0" stroke="#db61a2" stroke-width="2.5"/><text x="395.0" y="438" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#db61a2" text-anchor="middle" font-weight="bold">TERE4AI MCP Server</text><text x="395.0" y="460" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">Python, FastMCP</text><text x="395.0" y="477.5" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">stdio / localhost</text><text x="395.0" y="495.0" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">tools: classify_ai_system,</text><text x="395.0" y="512.5" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">get_applicable_requirements,</text><text x="395.0" y="530.0" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">evaluate_project_evidence, ...</text><rect x="585" y="410" width="300" height="140" rx="14" fill="#0f1a2b" fill-opacity="1.0" stroke="#4493f8" stroke-width="2.5"/><text x="735.0" y="438" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#4493f8" text-anchor="middle" font-weight="bold">Demo Web UI</text><text x="735.0" y="460" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">Next.js, per @DESIGN.md</text><text x="735.0" y="477.5" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">thin, read-only HTTP facade</text><text x="735.0" y="495.0" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">every screen: citations, judge</text><text x="735.0" y="512.5" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">verdict, status, legal notice</text><rect x="360" y="610" width="450" height="150" rx="14" fill="#211a10" fill-opacity="1.0" stroke="#e3873c" stroke-width="2.5"/><text x="585.0" y="638" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#e3873c" text-anchor="middle" font-weight="bold">Domain / Service Layer</text><text x="585.0" y="660" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa4ad" text-anchor="middle">requirements generation, risk classification</text><text x="585.0" y="678" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa4ad" text-anchor="middle">runtime grounding judge on every answer</text><text x="585.0" y="696" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa4ad" text-anchor="middle">traceability + audit log, calibrated status</text><text x="585.0" y="714" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa4ad" text-anchor="middle">vocabulary (never 'compliant')</text><rect x="1085" y="470" width="330" height="230" rx="14" fill="#0f1a2b" fill-opacity="1.0" stroke="#4493f8" stroke-width="2.5"/><text x="1250.0" y="498" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#4493f8" text-anchor="middle" font-weight="bold">Neo4j Knowledge Graph</text><text x="1250.0" y="520" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">full EU AI Act structural mirror</text><text x="1250.0" y="537.5" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">(113 art / 180 rec / 13 annexes)</text><text x="1250.0" y="555.0" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">deep norms: high-risk core</text><text x="1250.0" y="572.5" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">reified HLEG alignments</text><text x="1250.0" y="590.0" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">provenance on every edge</text><text x="1250.0" y="607.5" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">versioned (Act + Omnibus)</text><text x="1250.0" y="625.0" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">RDF export via n10s</text><line x1="405" y1="276" x2="395" y2="410" stroke="#8b98a5" stroke-width="2.4" marker-end="url(#ah)"/><text x="300" y="350" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#7fe3e8" text-anchor="middle" font-style="italic">MCP (stdio/localhost)</text><line x1="765" y1="276" x2="735" y2="410" stroke="#8b98a5" stroke-width="2.4" marker-end="url(#ah)"/><text x="800" y="350" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#7fe3e8" text-anchor="middle" font-style="italic">HTTP</text><line x1="395" y1="550" x2="480" y2="610" stroke="#8b98a5" stroke-width="2.4" marker-end="url(#ah)"/><line x1="735" y1="550" x2="650" y2="610" stroke="#8b98a5" stroke-width="2.4" marker-end="url(#ah)"/><line x1="810" y1="680" x2="1085" y2="600" stroke="#8b98a5" stroke-width="2.4" marker-end="url(#ah)"/><text x="700" y="795" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#6e7681" text-anchor="middle" font-style="italic">the graph and project evidence never leave the machine in self-hosted mode</text><text x="40" y="868" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#6e7681" text-anchor="start" font-weight="bold" letter-spacing="1.5">RUNTIME MODELS  &amp;  DATA SOVEREIGNTY</text><rect x="300" y="888" width="430" height="62" rx="14" fill="#0f2015" fill-opacity="1.0" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="6,5"/><text x="515.0" y="916" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#3fb950" text-anchor="middle" font-weight="bold">Local model (Tier 3)</text><text x="515.0" y="938" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa4ad" text-anchor="middle">experimental: fully on-machine, lower quality</text><line x1="60" y1="978" x2="1620" y2="978" stroke="#f85149" stroke-width="2.5" stroke-dasharray="10,8"/><text x="72" y="972" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#f0857f" text-anchor="start" font-weight="bold">ON-MACHINE (sovereign)</text><text x="1608" y="972" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#f0857f" text-anchor="end" font-weight="bold">LEAVES THE MACHINE</text><rect x="850" y="996" width="500" height="66" rx="14" fill="#241812" fill-opacity="1.0" stroke="#f0a675" stroke-width="2.5"/><text x="1100.0" y="1024" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#f0a675" text-anchor="middle" font-weight="bold">OpenAI API (runtime internals)</text><text x="1100.0" y="1046" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">generator for extraction, alignment, answers; judge family: OPEN</text><text x="1100.0" y="1063.5" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">(recommended: independent non-OpenAI judge)</text><line x1="500" y1="760" x2="515" y2="888" stroke="#8b98a5" stroke-width="2.4" marker-end="url(#ah)"/><text x="440" y="830" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#6e7681" text-anchor="middle" font-style="italic">Tier 3 option</text><line x1="700" y1="760" x2="1080" y2="996" stroke="#8b98a5" stroke-width="2.4" marker-end="url(#ah)"/><text x="960" y="860" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#6e7681" text-anchor="middle" font-style="italic">generator (+ judge)</text><text x="40" y="1112" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#6e7681" text-anchor="start" font-weight="bold" letter-spacing="1.5">BUILD-TIME (offline)  -  producing the knowledge graph</text><rect x="70" y="1136" width="235" height="96" rx="14" fill="#161b22" fill-opacity="1.0" stroke="#8b949e" stroke-width="2.5"/><text x="187.5" y="1164" font-family="DejaVu Sans, sans-serif" font-size="14.5" fill="#8b949e" text-anchor="middle" font-weight="bold">EU AI Act + HLEG</text><text x="187.5" y="1186" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">OJ text via CELLAR / ELI</text><text x="187.5" y="1203.5" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">frozen + checksummed</text><rect x="345" y="1136" width="235" height="96" rx="14" fill="#161b22" fill-opacity="1.0" stroke="#8b949e" stroke-width="2.5"/><text x="462.5" y="1164" font-family="DejaVu Sans, sans-serif" font-size="14.5" fill="#8b949e" text-anchor="middle" font-weight="bold">Deterministic parse</text><text x="462.5" y="1186" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">structure from eIds, no LLM</text><text x="462.5" y="1203.5" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">cross-refs by rule first</text><rect x="620" y="1136" width="240" height="96" rx="14" fill="#241812" fill-opacity="1.0" stroke="#f0a675" stroke-width="2.5"/><text x="740.0" y="1164" font-family="DejaVu Sans, sans-serif" font-size="14.5" fill="#f0a675" text-anchor="middle" font-weight="bold">LLM extraction</text><text x="740.0" y="1186" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">deontic norms + HLEG</text><text x="740.0" y="1203.5" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">alignments (OpenAI)</text><rect x="900" y="1136" width="240" height="96" rx="14" fill="#1c1626" fill-opacity="1.0" stroke="#d2a8ff" stroke-width="2.5"/><text x="1020.0" y="1164" font-family="DejaVu Sans, sans-serif" font-size="14.5" fill="#d2a8ff" text-anchor="middle" font-weight="bold">JUDGES</text><text x="1020.0" y="1186" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">extraction + mapping judges</text><text x="1020.0" y="1203.5" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">accept / reject / review</text><rect x="1180" y="1136" width="235" height="96" rx="14" fill="#0f1a2b" fill-opacity="1.0" stroke="#4493f8" stroke-width="2.5"/><text x="1297.5" y="1164" font-family="DejaVu Sans, sans-serif" font-size="14.5" fill="#4493f8" text-anchor="middle" font-weight="bold">Neo4j KG</text><text x="1297.5" y="1186" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">verified edges only,</text><text x="1297.5" y="1203.5" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#9aa4ad" text-anchor="middle">provenance + versions</text><line x1="305" y1="1184" x2="345" y2="1184" stroke="#8b98a5" stroke-width="2.4" marker-end="url(#ah)"/><line x1="580" y1="1184" x2="620" y2="1184" stroke="#8b98a5" stroke-width="2.4" marker-end="url(#ah)"/><line x1="860" y1="1184" x2="900" y2="1184" stroke="#8b98a5" stroke-width="2.4" marker-end="url(#ah)"/><line x1="1140" y1="1184" x2="1180" y2="1184" stroke="#8b98a5" stroke-width="2.4" marker-end="url(#ah)"/><text x="1435" y="1170" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#6e7681" text-anchor="start" font-style="italic">Full structural mirror;</text><text x="1435" y="1188" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#6e7681" text-anchor="start" font-style="italic">deep extraction only on</text><text x="1435" y="1206" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#6e7681" text-anchor="start" font-style="italic">the high-risk core.</text><text x="1435" y="1224" font-family="DejaVu Sans, sans-serif" font-size="11.5" fill="#6e7681" text-anchor="start" font-style="italic">v1 slice = migration seed.</text><text x="40" y="1296" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#6e7681" text-anchor="start" font-weight="bold" letter-spacing="1.5">PHASE 2+  (later)</text><rect x="200" y="1312" width="1240" height="120" rx="14" fill="#12151b" fill-opacity="1.0" stroke="#484f58" stroke-width="2.5" stroke-dasharray="8,6"/><rect x="216" y="1297" width="116" height="30" rx="15" fill="#0b0e14" fill-opacity="1.0" stroke="#484f58" stroke-width="2"/><text x="274" y="1317" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#9aa4ad" text-anchor="middle" font-weight="bold" letter-spacing="1">PHASE 2+</text><text x="348" y="1317" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#9aa4ad" text-anchor="start" font-weight="bold">MULTI-TENANT HOSTED SaaS on Rahti (CSC, EU), same service layer and graph</text><text x="250" y="1372" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c9d1d9" text-anchor="start" font-weight="bold">REST API</text><text x="250" y="1394" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#6e7681" text-anchor="start">API keys, rate limits</text><text x="560" y="1372" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c9d1d9" text-anchor="start" font-weight="bold">Remote MCP</text><text x="560" y="1394" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#6e7681" text-anchor="start">streamable HTTP, OAuth</text><text x="880" y="1372" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c9d1d9" text-anchor="start" font-weight="bold">Multi-tenant</text><text x="880" y="1394" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#6e7681" text-anchor="start">usage metering, billing</text><text x="1180" y="1372" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c9d1d9" text-anchor="start" font-weight="bold">Full Web UI</text><text x="1180" y="1394" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#6e7681" text-anchor="start">accounts, dashboards</text><text x="220" y="1420" font-family="DejaVu Sans, sans-serif" font-size="12.5" fill="#6e7681" text-anchor="start" font-style="italic">Only transport, auth, and tenancy change. Core code stays identical.</text><line x1="40" y1="1466" x2="1640" y2="1466" stroke="#21262d" stroke-width="1.5"/><text x="840.0" y="1500" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#c9d1d9" text-anchor="middle">Stack: Python · FastAPI · FastMCP · Neo4j (+ n10s RDF export) · Next.js demo UI · Docker Compose · OpenAI runtime models · AGPL-3.0</text><text x="840.0" y="1528" font-family="DejaVu Sans, sans-serif" font-size="13.5" fill="#9aa4ad" text-anchor="middle">The coding agents that BUILD this (Opus 4.8 planning, Fable 5 implementation) are a separate layer from the runtime models above.</text><text x="840.0" y="1556" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#6e7681" text-anchor="middle" font-style="italic">Spec: docs/architecture.md · References: docs/references.md · Visual system: DESIGN.md · Agent rules: AGENTS.md</text></svg>