# TERE4AI v2, Phase 1 self-hosted (docs/architecture.md Section 9, Mode B)
# Neo4j only:       docker compose up -d
# Full demo stack:  docker compose --profile demo up -d
#   facade http://localhost:8008 (llms.txt, /.well-known/tere4ai.json)
#   web    http://localhost:3111 (/assess needs OPENAI/ANTHROPIC keys in .env
#   for the paid endpoints; classify and requirements work without them)
services:
  facade:
    build:
      context: .
      target: core
    container_name: tere4ai2_facade
    profiles: [demo]
    ports:
      - "127.0.0.1:8008:8008"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TERE4AI_GENERATOR_MODEL=${TERE4AI_GENERATOR_MODEL:-gpt-5.2}
      - TERE4AI_JUDGE_MODEL=${TERE4AI_JUDGE_MODEL:-claude-opus-4-8}
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    container_name: tere4ai2_web
    profiles: [demo]
    ports:
      - "127.0.0.1:3111:3111"
    depends_on:
      - facade
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: tere4ai2_neo4j
    ports:
      # loopback only; 7475/7688 to coexist with the legacy v1 container that
      # still holds 7474/7687 on this machine
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    environment:
      # dev default per user instruction (2026-07-08): local research setup,
      # loopback-bound, not production. Override NEO4J_PASSWORD in .env for
      # anything shared or hosted (Phase 2+).
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-tere4ai2_dev}
      - NEO4J_PLUGINS=["apoc", "n10s"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
