# Model configuration of record for evaluated builds (DEC-07 verify target).
# Generated values must match the .env used for the run; the eval harness
# (MILESTONE4) refuses to report results whose config does not match this file.
# Note added 2026-10-08: the models and counts below describe the July 2026
# build (gpt-5.2, claude-opus-4-8, built 2026-07-08), which is disposable; the
# prompt versions were moved to v4 on 2026-10-07 (B144) and to v5 on 2026-10-09
# (B145), and align_hleg and judge_alignment to v2 on 2026-10-12 (B163, DEC-28).
# On 2026-10-15 the prompt versions were moved to extract_norms and judge_norms
# v7, align_hleg and judge_alignment v3, and generate_backlog and
# runtime_grounding v3, the runtime judge of the backlog, of the evidence
# tool and of the E6 ablation's conditions named without a version alike
